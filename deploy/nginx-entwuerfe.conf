server {
    listen 80;
    root /usr/share/nginx/html;
    charset utf-8;

    location = / { return 302 /mockups/index.html; }
    location = /gesundheit { default_type text/plain; return 200 "ok\n"; }
    location /mockups/ { add_header Cache-Control "no-cache"; }
    location /frontend/node_modules/ { add_header Cache-Control "public, max-age=604800"; }
}
