<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Leitstelle: Funkmast mit drei Wellen, Bernstein auf blaugrauem Grund -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3d50"/>
      <stop offset="1" stop-color="#0c121a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="56" fill="url(#g)"/>
  <!-- Mast -->
  <polygon points="256,96 198,416 314,416" fill="none" stroke="#ffb52e" stroke-width="22" stroke-linejoin="miter"/>
  <line x1="214" y1="320" x2="298" y2="320" stroke="#ffb52e" stroke-width="18"/>
  <line x1="228" y1="240" x2="284" y2="240" stroke="#ffb52e" stroke-width="18"/>
  <rect x="166" y="404" width="180" height="26" fill="#ffb52e"/>
  <!-- Spitze -->
  <circle cx="256" cy="88" r="22" fill="#ffb52e"/>
  <!-- Wellen links und rechts -->
  <path d="M176,140 A110,110 0 0 0 176,36" fill="none" stroke="#ffb52e" stroke-width="18" stroke-linecap="square" transform="translate(-10 0)"/>
  <path d="M136,170 A160,160 0 0 0 136,6" fill="none" stroke="#ffb52e" stroke-width="18" stroke-linecap="square" opacity="0.55" transform="translate(-6 0)"/>
  <path d="M336,140 A110,110 0 0 1 336,36" fill="none" stroke="#ffb52e" stroke-width="18" stroke-linecap="square" transform="translate(10 0)"/>
  <path d="M376,170 A160,160 0 0 1 376,6" fill="none" stroke="#ffb52e" stroke-width="18" stroke-linecap="square" opacity="0.55" transform="translate(6 0)"/>
</svg>
