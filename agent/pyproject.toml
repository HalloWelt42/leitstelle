[project]
name = "leitstelle-agent"
description = "Knoten-Agent der Leitstelle: misst Speicher und Last, startet und hält die KI-Dienste des Rechners an"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
  "pydantic>=2.7",
  "websockets>=13",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
leitstelle-agent = "leitstelle_agent.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["leitstelle_agent*"]

[tool.setuptools.package-data]
"leitstelle_agent" = ["VERSION"]

[tool.setuptools.dynamic]
version = {attr = "leitstelle_agent.__version__"}
