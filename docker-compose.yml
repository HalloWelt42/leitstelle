# Betrieb auf dem Pi: Apps und Browser kommen nur über HTTPS auf 8531 (Vorschaltdienst mit dem Zertifikat der Hausstelle
# im Ordner zertifikate/, tools/ausrollen.sh stellt es aus), Entwürfe auf 8535 nur am Pi (im Heimnetz über den Vorbau). Der Kern (Fassade /v1, Verwaltung /api,
# Oberfläche) lauscht auf 8530 nur im inneren Netz hinter dem Vorschaltdienst; seit LS-6 ist dieser Port nicht mehr
# veröffentlicht. Daten (SQLite, Tresorschlüssel) im Ordner LEITSTELLE_DATENORDNER (Vorgabe ./daten); er gehört dem
# Benutzer 1000.
services:
  leitstelle:
    build: { context: ., target: leitstelle }
    image: leitstelle
    container_name: leitstelle
    user: "1000:1000"
    environment:
      # nur vom Vorschaltdienst gilt X-Forwarded-For als Herkunft (Netzprüfung, Prüfprotokoll)
      LEITSTELLE_VORSCHALTUNG: '["${LEITSTELLE_VORNE_IP:-10.201.53.2}"]'
    networks: [innen]
    volumes:
      - ${LEITSTELLE_DATENORDNER:-./daten}:/daten
      # Ortszeit des Pi: Zeitfenster für Hintergrundarbeit und "heute" in den Kennzahlen hängen davon ab
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    stop_grace_period: 30s

  vorne:
    image: caddy:2.11.7-alpine
    container_name: leitstelle-vorne
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on: [leitstelle]
    ports:
      - "8531:8531"
    networks:
      innen:
        ipv4_address: ${LEITSTELLE_VORNE_IP:-10.201.53.2}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LEITSTELLE_ZERTIFIKATE:-./zertifikate}:/zertifikate:ro

  entwuerfe:
    build: { context: ., target: entwuerfe }
    image: leitstelle-entwuerfe
    container_name: leitstelle-entwuerfe
    ports:
      # nur am Pi selbst (HELF-169): im Heimnetz über den Vorbau des Pi (HTTPS), die frühere Adresse leitet dorthin um
      - "127.0.0.1:8535:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/gesundheit"]
      interval: 30s
      timeout: 5s
      retries: 3

# Netz zwischen Vorschaltdienst und Kern mit fester Adresse des Vorschaltdienstes (sonst wüsste der Kern nicht, wem er
# X-Forwarded-For glauben darf). Docker vergibt Adressen nur aus ip_range, die feste Adresse liegt außerhalb davon; sonst
# kann der Kern sie beim Start schon belegt haben. Netz, Bereich und Adresse nur ändern, wenn das Netz auf dem Rechner
# schon vergeben ist.
networks:
  innen:
    ipam:
      config:
        - subnet: ${LEITSTELLE_INNENNETZ:-10.201.53.0/28}
          ip_range: ${LEITSTELLE_INNENNETZ_FREI:-10.201.53.8/29}
