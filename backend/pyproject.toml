[project]
name = "leitstelle"
description = "Leitstelle: Entscheidungskern (Zuteiler, Speicherplaner, Umschichter mit Regelgraphen) und Schein-Verbund zum Testen"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "cryptography>=43",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["leitstelle*"]

[tool.setuptools.package-data]
"leitstelle.ports.ablage" = ["migrationen/*.mako", "alembic.ini"]

[tool.setuptools.dynamic]
version = {attr = "leitstelle.__version__"}
